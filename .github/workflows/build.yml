name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Restore Binary Images
        run: python3 restore_images.py

      - name: Build iOS App
        run: |
          xcodebuild clean build \
            -project MellClicker.xcodeproj \
            -scheme MellClicker \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO > build.log 2>&1 || (echo "=== BUILD FAILED ===" && grep -A 5 -B 5 -i "error:" build.log && exit 1)

      - name: Package App into .ipa
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: MellClicker.app not found!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r MellClicker.ipa Payload
          echo "Successfully created MellClicker.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MellClicker-IPA
          path: build/MellClicker.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Release v1.0.0 (Build ${{ github.run_number }})"
          body: |
            🎉 **Официальный релиз MellClicker!**
            
            В этой версии:
            - Установлены новые иконки приложения и кнопки (Mellstroy)
            - Звуки кликов и автокликера теперь работают правильно (даже в беззвучном режиме)
            - Улучшен и обновлен игровой баланс
            
            📥 **Как установить:**
            Скачайте прикрепленный файл `MellClicker.ipa` ниже и установите его на ваше iOS-устройство с помощью AltStore, Sideloadly, TrollStore или Scarlet.
          files: build/MellClicker.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
