name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build iOS App (.ipa)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build and Archive iOS App
        run: |
          xcodebuild -project MellClicker.xcodeproj \
                     -scheme MellClicker \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath build/MellClicker.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     archive

      - name: Package App into .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/MellClicker.xcarchive/Products/Applications/MellClicker.app build/Payload/
          cd build
          zip -r MellClicker.ipa Payload
          echo "Successfully created MellClicker.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MellClicker-IPA
          path: build/MellClicker.ipa
