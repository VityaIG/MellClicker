name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Restore Binary Images
        run: python3 restore_images.py

      - name: Build iOS Application
        run: |
          rm -rf build
          mkdir -p build/output
          
          xcodebuild clean build \
            -project MellClicker.xcodeproj \
            -scheme MellClicker \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/output" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO > build.log 2>&1 || (echo "=== BUILD FAILED ===" && cat build.log | tail -n 60 && exit 1)

      - name: Assemble and Verify Valid IPA Bundle
        run: |
          rm -rf build/Payload build/MellClicker.ipa
          mkdir -p build/Payload
          
          APP_PATH="build/output/MellClicker.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Searching for compiled MellClicker.app..."
            APP_PATH=$(find build -name "MellClicker.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Error: MellClicker.app was not generated by xcodebuild!"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          
          # 1. Копируем бандл приложения в Payload/MellClicker.app
          cp -R "$APP_PATH" "build/Payload/MellClicker.app"
          TARGET_APP="build/Payload/MellClicker.app"
          
          # 2. Очищаем все скрытые файлы и расширенные атрибуты
          xattr -cr "$TARGET_APP" || true
          find "$TARGET_APP" -name ".DS_Store" -delete || true
          find "$TARGET_APP" -name "._*" -delete || true
          
          # 3. Удаляем старые/пустые подписи
          rm -rf "$TARGET_APP/_CodeSignature"
          rm -f "$TARGET_APP/embedded.mobileprovision"
          
          # 4. Копируем гарантированно валидный Info.plist с явными значениями
          cp MellClicker/Resources/Info.plist "$TARGET_APP/Info.plist"
          plutil -convert xml1 "$TARGET_APP/Info.plist"
          plutil -lint "$TARGET_APP/Info.plist"
          
          # 5. Создаем стандартный PkgInfo для идентификации пакета iOS
          printf "APPL????" > "$TARGET_APP/PkgInfo"
          
          # 6. Выставляем правильные права на бинарный файл и структуру
          if [ -f "$TARGET_APP/MellClicker" ]; then
            chmod +x "$TARGET_APP/MellClicker"
          fi
          chmod -R 755 "build/Payload"
          
          # 7. Проверка структуры бандла
          echo "=== Bundle Contents ==="
          ls -la "$TARGET_APP"
          
          # 8. Упаковка в корневой Payload .ipa архив
          cd build
          zip -r -9 MellClicker.ipa Payload -x "*.DS_Store" -x "__MACOSX*"
          
          echo "=== IPA Verification ==="
          unzip -l MellClicker.ipa
          
          if [ ! -s MellClicker.ipa ]; then
            echo "Error: MellClicker.ipa is empty or missing!"
            exit 1
          fi
          echo "MellClicker.ipa is ready and validated."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MellClicker-IPA
          path: build/MellClicker.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v1.0.0"
          name: "MellClicker v1.0.0 — Release"
          body: |
            # MellClicker v1.0.0

            Нативная игра-кликер для iOS (SwiftUI, MVVM).

            ### Изменения:
            - **3D Кнопка кликера**: Интерактивная кнопка с физикой микро-наклона, металлическим кантом и оптимизированными шейдерами.
            - **Баланс и интерфейс**: Скорректированы отступы экрана, баланс опущен ниже для комфортного восприятия.
            - **Combo HUD**: Панель множителей комбо-серий с возможностью отключения в Настройках.
            - **Магазин улучшений**: Прокачка силы клика («Чекушка») и пассивного дохода («Чекунец»).
            - **Таблица лидеров**: Синхронизация рекордов и просмотр глобального рейтинга.
            - **Оптимизация производительности**: Снижена нагрузка на CPU и GPU, устранен нагрев устройства и оптимизирован расход батареи.
            - **Кастомизация**: Поддержка темной/светлой темы, выбор акцентного цвета и тактильного отклика.

            ### Установка:
            1. Скачайте `MellClicker.ipa` из вложений.
            2. Установите через AltStore, SideStore, Sideloadly, TrollStore или Scarlet.
          files: build/MellClicker.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
