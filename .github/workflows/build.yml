name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Restore Binary Images
        run: python3 restore_images.py

      - name: Build iOS App Archive
        run: |
          xcodebuild clean archive \
            -project MellClicker.xcodeproj \
            -scheme MellClicker \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/MellClicker.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO > build.log 2>&1 || (echo "=== BUILD FAILED ===" && grep -A 5 -B 5 -i "error:" build.log && exit 1)

      - name: Package App into Sideload-Ready .ipa
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build -name "MellClicker.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: MellClicker.app not found!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          
          # 1. Очистка системных мусорных файлов и расширенных атрибутов macOS (xattr)
          xattr -cr "$APP_PATH" || true
          find "$APP_PATH" -name ".DS_Store" -delete || true
          find "$APP_PATH" -name "._*" -delete || true
          
          # 2. Копирование бандла приложения в Payload
          cp -R "$APP_PATH" "build/Payload/MellClicker.app"
          
          # 3. Выставление корректных POSIX прав (исполняемый файл обязателен для подписи)
          chmod +x "build/Payload/MellClicker.app/MellClicker" || true
          chmod -R 755 "build/Payload"
          
          # 4. Удаление старых или поврежденных сигнатур и профилей
          rm -rf "build/Payload/MellClicker.app/_CodeSignature"
          rm -f "build/Payload/MellClicker.app/embedded.mobileprovision"
          
          # 5. Ad-Hoc подпись с поддержкой DER-энтайтлментов (требование iOS 15+)
          codesign --force --deep --sign - --timestamp=none --generate-entitlement-der "build/Payload/MellClicker.app"
          
          # 6. Проверка валидности структуры подписи
          codesign --verify --deep --verbose "build/Payload/MellClicker.app" || true
          
          cd build
          # 7. Упаковка в стандартизированный zip-архив .ipa
          zip -qry9 MellClicker.ipa Payload
          echo "Successfully created MellClicker.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MellClicker-IPA
          path: build/MellClicker.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v1.0.0"
          name: "MellClicker v1.0.0 — Release"
          body: |
            # MellClicker v1.0.0

            Нативная игра-кликер для iOS (SwiftUI, MVVM).

            ### Изменения:
            - **3D Кнопка кликера**: Интерактивная кнопка с физикой микро-наклона, металлическим кантом и оптимизированными шейдерами.
            - **Баланс и интерфейс**: Скорректированы отступы экрана, баланс опущен ниже для комфортного восприятия.
            - **Combo HUD**: Панель множителей комбо-серий с возможностью отключения в Настройках.
            - **Магазин улучшений**: Прокачка силы клика («Чекушка») и пассивного дохода («Чекунец»).
            - **Таблица лидеров**: Синхронизация рекордов и просмотр глобального рейтинга.
            - **Оптимизация производительности**: Снижена нагрузка на CPU и GPU, устранен нагрев устройства и оптимизирован расход батареи.
            - **Кастомизация**: Поддержка темной/светлой темы, выбор акцентного цвета и тактильного отклика.

            ### Установка:
            1. Скачайте `MellClicker.ipa` из вложений.
            2. Установите через AltStore, SideStore, Sideloadly, TrollStore или Scarlet.
          files: build/MellClicker.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
