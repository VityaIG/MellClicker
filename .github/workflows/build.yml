name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Restore Binary Images
        run: python3 restore_images.py

      - name: Build iOS App
        run: |
          xcodebuild clean build \
            -project MellClicker.xcodeproj \
            -scheme MellClicker \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO > build.log 2>&1 || (echo "=== BUILD FAILED ===" && grep -A 5 -B 5 -i "error:" build.log && exit 1)

      - name: Package App into .ipa
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: MellClicker.app not found!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          
          # 1. Очищаем все скрытые атрибуты macOS (xattr) и мусорные файлы, которые ломают подпись
          xattr -cr "$APP_PATH"
          find "$APP_PATH" -name ".DS_Store" -delete || true
          find "$APP_PATH" -name "._*" -delete || true
          
          # 2. Копируем в Payload
          ditto "$APP_PATH" "build/Payload/$(basename "$APP_PATH")"
          
          # 3. Дополнительно очищаем Payload и выставляем корректные POSIX права доступа
          xattr -cr "build/Payload"
          chmod -R 755 "build/Payload"
          
          # 4. Удаляем старую сигнатуру и выполняем чистую Ad-Hoc подпись без таймстемпов
          rm -rf "build/Payload/$(basename "$APP_PATH")/_CodeSignature"
          codesign --force --sign - --timestamp=none "build/Payload/$(basename "$APP_PATH")"
          
          # 5. Проверяем валидность подписи
          codesign --verify --verbose "build/Payload/$(basename "$APP_PATH")" || true
          
          cd build
          # 6. Упаковываем в чистый zip/ipa с сохранением прав и ссылок
          zip -qry MellClicker.ipa Payload
          echo "Successfully created MellClicker.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MellClicker-IPA
          path: build/MellClicker.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v1.0.0"
          name: "MellClicker v1.0.0 — Release"
          body: |
            # MellClicker v1.0.0

            Нативная игра-кликер для iOS (SwiftUI, MVVM).

            ### Изменения:
            - **3D Кнопка кликера**: Интерактивная кнопка с физикой микро-наклона, металлическим кантом и оптимизированными шейдерами.
            - **Баланс и интерфейс**: Скорректированы отступы экрана, баланс опущен ниже для комфортного восприятия.
            - **Combo HUD**: Панель множителей комбо-серий с возможностью отключения в Настройках.
            - **Магазин улучшений**: Прокачка силы клика («Чекушка») и пассивного дохода («Чекунец»).
            - **Таблица лидеров**: Синхронизация рекордов и просмотр глобального рейтинга.
            - **Оптимизация производительности**: Снижена нагрузка на CPU и GPU, устранен нагрев устройства и оптимизирован расход батареи.
            - **Кастомизация**: Поддержка темной/светлой темы, выбор акцентного цвета и тактильного отклика.

            ### Установка:
            1. Скачайте `MellClicker.ipa` из вложений.
            2. Установите через AltStore, SideStore, Sideloadly, TrollStore или Scarlet.
          files: build/MellClicker.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
